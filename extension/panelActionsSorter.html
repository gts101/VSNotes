<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Action Sorter</title>
    <style>
         body {
            padding: 0.4em;
            margin:0;
            box-sizing: border-box;
            padding-top: 0;
            background-color:#191a1b;
        }

       
        #sorterDiv {
            position: relative;
            margin: 0;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .action {
            position: absolute;
            display: flex;
            align-items: center;
            width:100%;
            height: 20px;
            padding: 4px;
            
            box-sizing: border-box;
            
            user-select: none;
            gap: 5px;
            transition: top 0.25s;
            cursor: pointer;
        }

        .template {
            display: none;
        }

        .action.dragging {
            opacity: 0.95;
            z-index: 1000;
            box-shadow:
                0 5px 5px rgba(0, 0, 0, 0.55),
                0 3px 8px rgba(0, 0, 0, 0.35);

            transform: scale(1.02);
            cursor: grabbing;
            transition: none;
            /* transform: scale(1.1) rotate(2deg); */
        }

        .action.actionMoved {
            background-color: #ffffff11;
        }

        .action:hover {
            background-color: #ffffff22;
        }

        .action:active {
            background: #FF000066;
        }

        .actionPath {
            color: #666;
            font-size: 1em;
            line-height:1em;
        }

        .actionPriority {
            width: 20px;
            flex: 0 0 20px;
            /* font-weight: bold; */
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            font-size: 1em;
            box-sizing:border-box;
            border: 2px solid transparent;
        }


        .actionText {
            flex: 1;
            min-width: 0;
            color: #aaa;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 1em;
            line-height:1em;
        }

    </style>
</head>

<body>
    <!-- <input type="button" value="Get Actions" onclick="getActions()" /> -->
    <div id="sorterDiv">
        <div id="actionTemplate" class="action template">
            <div class="actionPriority"></div>
            <div class="actionText"></div>
        </div>
    </div>
    <script src="panelActionsSorter.js"></script>
</body>

</html>
